    <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
    <script>
      // Alle .fade-in-blokken staan in CSS op opacity:0 en worden pas door
      // Motion zichtbaar gemaakt. Laadt die bibliotheek niet, dan zou de hele
      // pagina leeg blijven, ook voor zoekmachines. Val dan terug op
      // zichtbare inhoud zonder animatie.
      if (typeof Motion === "undefined") {
        document.querySelectorAll(".fade-in").forEach((element) => {
          element.style.opacity = 1;
        });
      } else {
      const { animate, inView, delay } = Motion
      inView(".fade-in", (element) => {
        settings = {
          "up": { opacity: [0, 1], y: [40, 0] },
          "down": { opacity: [0, 1], y: [-40, 0] },
          "left": { opacity: [0, 1], x: [40, 0] },
          "right": { opacity: [0, 1], x: [-40, 0] },
        }
        if (element.classList.contains("up")) {
          direction = "up";
        }
        if (element.classList.contains("down")) {
          direction = "down";
        }
        if (element.classList.contains("left")) {
          direction = "left";
        }
        if (element.classList.contains("right")) {
          direction = "right";
        }
        setting = settings[direction];
        animate(
            element,
            setting,
            {
                duration: 1,
                ease: "anticipate",
                amount: 0.3
            }
        )
      });
      }

    </script>
